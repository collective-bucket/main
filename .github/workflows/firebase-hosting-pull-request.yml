name: Deploy preview on PR

on: pull_request

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: collective-bucket
          workload_identity_provider: projects/239510573325/locations/global/workloadIdentityPools/github-actions/providers/github-provider
      - run: python3 -m pip install --user google-auth requests
      - id: access-token
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import google.auth
          from google.auth.transport.requests import Request
          creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(Request())
          print(f"token={creds.token}")
          PY
      - run: npm ci
      - name: Deploy preview channel
        id: deploy
        run: |
          npx firebase-tools hosting:channel:deploy "pr-${{ github.event.number }}" \
            --only hosting:main \
            --token "${{ steps.access-token.outputs.token }}" \
            --non-interactive \
            | tee deploy-output.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.web\.app[^ ]*' deploy-output.txt | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.number }}" --body "🔗 Preview: ${{ steps.deploy.outputs.url }}"
