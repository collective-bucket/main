name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: collective-bucket
          workload_identity_provider: projects/239510573325/locations/global/workloadIdentityPools/github-actions/providers/github-provider
      - run: python3 -m pip install --user google-auth requests
      - id: access-token
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import google.auth
          from google.auth.transport.requests import Request
          creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(Request())
          print(f"token={creds.token}")
          PY
      - run: npm ci
      - run: npx firebase-tools deploy --only hosting:main --token "${{ steps.access-token.outputs.token }}" --non-interactive
